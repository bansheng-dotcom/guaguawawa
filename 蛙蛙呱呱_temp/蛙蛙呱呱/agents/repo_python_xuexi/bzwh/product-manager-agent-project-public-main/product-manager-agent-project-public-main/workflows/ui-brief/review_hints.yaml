workflow_id: ui-brief
version: "0.1"
type: optional_review_hints

purpose: >
  给 UI brief 生成可选复核提醒。这里不是触发图，不写死本地 agent 路径。

rules:
  - 只提醒角色类型。
  - 不自动生成高保真设计。

review_hints:
  ui_reviewer:
    remind_when:
      - 需要高保真、视觉系统、图表视觉或复杂交互
    ask_them_to_check:
      - 信息层级是否合理
      - 视觉风格是否匹配产品任务
      - 是否需要设计系统组件

  frontend_reviewer:
    remind_when:
      - 页面涉及路由、组件、状态或响应式
    ask_them_to_check:
      - 状态是否可实现
      - 组件边界是否清楚
      - 是否有前端验收缺口
