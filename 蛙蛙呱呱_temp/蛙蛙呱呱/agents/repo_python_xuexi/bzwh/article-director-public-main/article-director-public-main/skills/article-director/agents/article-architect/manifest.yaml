# manifest.yaml — 文章架构与大纲
name: "article-architect"
version: "1.0"
status: "compatibility-alias"
description: "兼容别名；第一大纲/细纲 agent 的权威契约暂在 topic-architect"

io:
  inputs:
    - "title"
    - "brief"
    - "workflow-profile.json"
  outputs:
    - "outline"
    - "detailed outline"
    - "outline inspection"

execution:
  temperature: 0.20
  node_type: "agent"
  parallel: false

prompt_ref: "prompts.yaml#agents.topic-architect"

dependencies:
  agents: []
  scripts:
    - "scripts/build_section_manifest.py"
  references: []
