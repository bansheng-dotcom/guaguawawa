workflow_id: product-strategy
version: "0.1"
type: optional_review_hints

purpose: >
  给产品战略报告生成可选复核提醒。这里不是触发图，不写死本地 agent 路径。

rules:
  - 只提醒角色类型。
  - 最终战略取舍仍由用户或负责人确认。

review_hints:
  data_reviewer:
    remind_when:
      - 战略取舍依赖规模、增长、留存、收入或成本
    ask_them_to_check:
      - 指标和数据是否支持取舍
      - 是否需要市场规模或分群数据

  research_reviewer:
    remind_when:
      - 战略判断依赖竞品、市场、用户研究或外部趋势
    ask_them_to_check:
      - 证据来源是否充分
      - 是否遗漏替代方案

  technical_reviewer:
    remind_when:
      - 战略依赖平台能力、AI 能力、架构或自动化壁垒
    ask_them_to_check:
      - 技术能力是否可沉淀
      - 短期方案是否损害长期架构
