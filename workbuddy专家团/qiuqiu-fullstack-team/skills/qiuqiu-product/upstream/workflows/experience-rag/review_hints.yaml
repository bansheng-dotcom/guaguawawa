purpose: >
  给经验 RAG 与沉淀流程生成可选复核提醒，不自动触发外部 agent。

optional_reviews:
  - when: 经验会影响正式 PRD、需求卡或下游开发文件
    reviewer_type: 产品管理复核
    focus:
      - 经验范围是否匹配
      - 是否把偏好误写成事实
      - 是否需要更新项目索引
  - when: 经验涉及数据、后端、架构或 UI 专业判断
    reviewer_type: 对应专业能力
    focus:
      - 经验是否只是 PM 表达规则
      - 专业事实是否需要重新验证

rules:
  - 经验可以提醒，不替代当前事实。
  - 候选经验不作为硬规则。
