workflow_id: technical-brief
version: "0.1"
type: optional_review_hints

purpose: >
  给技术翻译报告生成可选复核提醒。这里不是触发图，不写死本地 agent 路径。

rules:
  - 只提醒角色类型。
  - 不自动触发实现或架构设计。

review_hints:
  frontend_reviewer:
    remind_when:
      - brief 涉及页面、路由、状态、交互或组件
    ask_them_to_check:
      - 页面状态是否完整
      - 前端边界和验收是否清楚

  backend_reviewer:
    remind_when:
      - brief 涉及接口、数据、权限、后台任务或日志
    ask_them_to_check:
      - 数据和权限是否准确
      - 失败恢复和人工兜底是否可行

  architecture_reviewer:
    remind_when:
      - brief 涉及跨系统、公共接口、长期架构或不可逆决策
    ask_them_to_check:
      - 模块边界是否合理
      - 是否需要 ADR 或接口契约

  agent_reviewer:
    remind_when:
      - brief 涉及 Agent、模型、工具调用、记忆或自动化
    ask_them_to_check:
      - 输入输出是否可验收
      - 停止条件和人工确认是否清楚
