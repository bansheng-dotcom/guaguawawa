workflow_id: mvp-validation
display_name: MVP 与实验验证工作流
status: draft
owner: 产品管理
priority: P1
purpose: >
  将需求、产品想法或 PRD 草稿收敛成 MVP 假设和最低成本验证计划。这个 workflow
  负责定义承重假设、实验方式、成功/失败标准和停止条件；不负责实际开发实验或真实投放。

trigger_signals:
  - MVP 怎么做
  - 最小验证
  - 核心假设
  - 实验设计
  - 假门
  - concierge test
  - 先验证什么

entry_policy:
  before_entering:
    - 如果本轮要产出 MVP 验证报告，按重任务处理，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 重任务先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 先确认要验证的是需求、价值、可用性、商业还是技术假设
    - 如果需求不清楚，先回 requirement-report
    - 如果指标不清楚，先走 metrics-framework
  can_start_when:
    - 有产品目标或需求方向
    - 至少能写出一个可能让方案失败的假设
  must_not_start_when:
    - 用户已经要求直接写正式 PRD 或开发任务
    - 没有任何用户、场景或价值假设

required_inputs:
  - product_idea_or_requirement
  - target_user_or_scenario
  - key_assumptions
  - constraints

outputs:
  - mvp_validation_report
  - assumption_map
  - cheapest_test_plan
  - success_and_kill_criteria
  - learning_plan
  - optional_review_hints
  - next_workflow_suggestion

managed_files:
  topology: workflows/mvp-validation/topology.md
  quality_guide: workflows/mvp-validation/references/mvp-validation-guide.md
  review_hints: workflows/mvp-validation/review_hints.yaml
  runner: workflows/mvp-validation/runner.md
  prompt_current: workflows/mvp-validation/prompts/current.md
  prompt_changelog: workflows/mvp-validation/prompts/CHANGELOG.md
  heavy_task_rules: workflows/HEAVY_TASK_RAG_RULES.md

validation_gates:
  - gate: assumption_gate
    pass_standard: 至少识别价值、可用性、可行性、商业性中的承重假设
  - gate: mvp_gate
    pass_standard: MVP 只验证核心假设，不是缩小版完整产品
  - gate: experiment_gate
    pass_standard: 实验方式低成本、可执行、能产生学习结果
  - gate: criteria_gate
    pass_standard: 成功标准、失败标准、停止或转向条件清楚
  - gate: handoff_hint_gate
    pass_standard: 只给可选实验/数据/UI/技术复核提醒，不自动触发

version:
  prompt: "0.3"
  workflow: "0.3"
  updated_at: "2026-07-01"
