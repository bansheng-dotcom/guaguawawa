# 报告门禁策略（三阶段：warn → dryrun → deny）
# 当前阶段：warn（只记违规，不阻断交付）
stage: warn

tiers:
  A:            # 分析研究型
    retention_min: 0.95
    trace_min: 1.0
    coverage_min: 0.60
  B:            # 方案决策 / 评审 / 设计
    retention_min: 0.90
    trace_min: 1.0
    coverage_min: 0.50
  C:            # 执行交付型
    retention_min: 0.90
    trace_min: 1.0
    coverage_min: null

# 提升规则：连续 4 周违规数为 0，才可把 stage 提升一档
promotion:
  from_warn_to_dryrun: 4_weeks_zero_violations
  from_dryrun_to_deny: 2_weeks_zero_violations
