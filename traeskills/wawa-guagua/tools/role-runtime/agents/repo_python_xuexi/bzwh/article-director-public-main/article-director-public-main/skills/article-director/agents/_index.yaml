# agents/_index.yaml — Article Director Subagent 注册表
# 机器可解析。lean-v1 保留 4 个上层职责；section-editor 内部由 reviewer/rewriter 支撑。

_version: "2.0"
_updated: "2026-06-29"
default_profile: "lean-v1"

profiles:
  lean-v1:
    description: "4 个核心职责：架构、单节写作、单节编辑、整稿收口。section-editor 内部展开为 review fan-out + centralized rewrite。"
    core_agents:
      - topic-architect
      - section-writer
      - section-editor
      - final-integrator
    implementation_support_agents:
      - section-reviewer
      - paragraph-rewrite-designer
      - section-rewriter
    optional_support:
      - deep-dive-researcher
      - image-ui
  standard-legacy:
    description: "历史多 agent 链路，保留用于回归和兼容，不作为新默认结构。"

agents:

  - name: topic-architect
    path: agents/topic-architect/
    status: active
    role: 第一大纲/细纲 agent；负责读者卡点、知识上下游、逻辑顺序、示例和展示方式规划
    node_types: [agent]
    used_in: [bootstrap]

  - name: article-architect
    path: agents/article-architect/
    status: compatibility-alias
    role: 兼容别名；后续稳定后再决定是否正式重命名 topic-architect
    node_types: [agent]
    used_in: [bootstrap/lean-compat]

  - name: section-writer
    path: agents/section-writer/
    status: active
    role: 单节上下文写作与 reader-use-contract
    node_types: [agent]
    used_in: [expanded/lean-section-loop]
    parallel: true

  - name: section-editor
    path: agents/section-editor/
    status: active
    role: 单节编辑总入口；真实执行由五类 section-reviewer fan-out + section-rewriter 集中修改完成
    node_types: [agent]
    used_in: [expanded/lean-section-loop]
    parallel: true

  - name: section-reviewer
    path: agents/section-reviewer/
    status: active
    role: 单节维度审查；只提意见，不改正文
    node_types: [agent]
    used_in: [expanded/lean-section-loop]
    parallel: true

  - name: paragraph-rewrite-designer
    path: agents/paragraph-rewrite-designer/
    status: active
    role: review fan-out 之后的 v2 改写设计；覆盖所有正文微调，并对重构单元生成候选、评分、选中草稿
    node_types: [agent]
    used_in: [expanded/lean-section-loop]
    parallel: true

  - name: section-rewriter
    path: agents/section-rewriter/
    status: active
    role: assembles selected rewrite units, applies micro edits, smooths section flow, and preserves section-editor-result downstream contract
    node_types: [agent]
    used_in: [expanded/lean-section-loop]
    parallel: true

  - name: final-integrator
    path: agents/final-integrator/
    status: active
    role: 整稿连贯性、风格统一、终稿收口
    node_types: [agent]
    used_in: [expanded/lean-convergence]

  - name: deep-dive-researcher
    path: agents/deep-dive-researcher/
    status: optional-support
    role: 深度研究（论文、机制、开源实现）
    node_types: [agent]
    used_in: [optional/research]

  - name: image-ui
    path: agents/image-ui/
    status: optional-support
    role: 配图生成与清单
    node_types: [agent]
    used_in: [optional/image-chain]

  - name: director
    path: agents/director/
    status: legacy
    role: 旧流程编排；lean-v1 中由 topic-architect + 确定性脚本替代
    node_types: [agent]
    used_in: [bootstrap/standard-legacy]

  - name: legacy-topic-architect
    path: agents/topic-architect/
    status: superseded-entry
    role: 历史占位；请使用 active 的 topic-architect 条目
    node_types: [agent]
    used_in: [bootstrap/standard-legacy]

  - name: writer-research
    path: agents/writer-research/
    status: legacy
    role: 旧证据填充与段落写作；lean-v1 中由 section-writer 替代
    node_types: [agent]
    used_in: [expanded/standard-legacy]
    parallel: true

  - name: adversarial-reviewer
    path: agents/adversarial-reviewer/
    status: legacy
    role: 旧对抗审查；lean-v1 中并入 section-editor
    node_types: [agent]
    used_in: [expanded/standard-legacy]
    parallel: true

  - name: article-review
    path: agents/article-review/
    status: legacy
    role: 旧多维审查；lean-v1 中并入 section-editor，最终检查由确定性脚本承担
    node_types: [agent]
    used_in: [expanded/standard-legacy]
    parallel: true

  - name: concept-bridge-rewriter
    path: agents/concept-bridge-rewriter/
    status: legacy
    role: 旧概念桥接改写；lean-v1 中并入 section-editor
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: final-package-editor
    path: agents/final-package-editor/
    status: legacy
    role: 旧包级终稿收敛；lean-v1 中并入 final-integrator
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: narrative-smoother
    path: agents/narrative-smoother/
    status: legacy
    role: 旧叙事连贯性与 AI 味修订；lean-v1 中并入 section-editor
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: primer-writer
    path: agents/primer-writer/
    status: legacy
    role: 旧入门导引写作；lean-v1 中并入 section-writer
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: structure-editor
    path: agents/structure-editor/
    status: legacy
    role: 旧后期结构编辑；lean-v1 中并入 section-editor
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: style-harmonizer
    path: agents/style-harmonizer/
    status: legacy
    role: 旧整稿风格统一；lean-v1 中由 final-integrator 替代
    node_types: [agent]
    used_in: [expanded/standard-legacy]

  - name: appendix-agent
    path: agents/appendix-agent/
    status: script-support
    role: 附录打包脚本索引，非核心 agent
    node_types: [script]
    used_in: [expanded/convergence]

  - name: sentence-pattern-detemplatizer
    path: agents/sentence-pattern-detemplatizer/
    status: deprecated
    role: 句式去模板化兼容入口；规则已迁移到 ai-tone-director
    node_types: [support-skill]
    used_in: []
    notes: 历史路径兼容；新 workflow 应引用 D:\知识库\skills\内容生产\ai-tone-director\SKILL.md

  - name: term-annotator
    path: agents/term-annotator/
    status: deprecated
    role: 术语标注（已废弃，兼容保留）
    node_types: [agent]
    used_in: []
    notes: lean-v1 中术语职责并入 section-editor 与 appendix 脚本
