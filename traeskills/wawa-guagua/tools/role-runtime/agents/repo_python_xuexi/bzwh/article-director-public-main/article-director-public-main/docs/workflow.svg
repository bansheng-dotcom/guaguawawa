    <text x="755" y="350" font-size="17" font-weight="700" fill="#14532D" text-anchor="middle">section-rewriter</text>
    <text x="755" y="375" font-size="13" fill="#15803D" text-anchor="middle">合稿 / 顺句 / 段间连接</text>

    <line x1="640" y1="361" x2="577" y2="361" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

