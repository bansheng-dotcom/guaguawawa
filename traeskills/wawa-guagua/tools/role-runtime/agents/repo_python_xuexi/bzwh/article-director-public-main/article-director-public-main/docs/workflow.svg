    <line x1="320" y1="361" x2="257" y2="361" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="64" y="318" width="210" height="86" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="169" y="350" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">draft-assembler</text>
    <text x="169" y="375" font-size="13" fill="#475569" text-anchor="middle">组装各 section</text>

    <line x1="169" y1="404" x2="169" y2="474" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="64" y="490" width="260" height="86" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="194" y="522" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">final-integrator</text>
    <text x="194" y="547" font-size="13" fill="#475569" text-anchor="middle">全文连贯性和风格统一</text>

    <line x1="324" y1="533" x2="386" y2="533" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="402" y="490" width="318" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="561" y="522" font-size="17" font-weight="700" fill="#92400E" text-anchor="middle">deterministic gates</text>
    <text x="561" y="547" font-size="13" fill="#B45309" text-anchor="middle">integrity / argument-flow / code-check</text>

    <line x1="720" y1="533" x2="782" y2="533" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="798" y="490" width="260" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="928" y="522" font-size="17" font-weight="700" fill="#92400E" text-anchor="middle">human gate 2</text>
    <text x="928" y="547" font-size="13" fill="#B45309" text-anchor="middle">人工终审，不自动发布</text>
  </g>

  <text x="64" y="666" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748B">Temporary outputs, drafts, state logs, and platform copies are ignored by Git. The repository stores reusable workflow code and configuration.</text>
</svg>
