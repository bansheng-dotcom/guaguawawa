<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="64" y="70" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0F172A">Article Director Workflow</text>
  <text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">当前默认 lean-v1：topic-first planning, candidate writing, review absorption, rewrite design, deterministic gates.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748B"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="64" y="156" width="210" height="78" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="169" y="187" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="middle">topic-architect</text>
    <text x="169" y="212" font-size="13" fill="#1D4ED8" text-anchor="middle">大纲 / 细纲 / 读者卡点</text>

    <line x1="274" y1="195" x2="337" y2="195" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="352" y="156" width="210" height="78" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="457" y="187" font-size="17" font-weight="700" fill="#92400E" text-anchor="middle">human gate 1</text>
    <text x="457" y="212" font-size="13" fill="#B45309" text-anchor="middle">确认大纲后写作</text>

    <line x1="562" y1="195" x2="625" y2="195" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="640" y="156" width="230" height="78" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="755" y="187" font-size="17" font-weight="700" fill="#134E4A" text-anchor="middle">section-writer</text>
    <text x="755" y="212" font-size="13" fill="#0F766E" text-anchor="middle">候选生成 / 删除 / 评分</text>

    <line x1="870" y1="195" x2="933" y2="195" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

