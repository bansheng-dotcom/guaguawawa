purpose: >
  给 PM 质问与思考流程生成可选复核提醒，不自动触发外部 agent。

optional_reviews:
  - when: 需求涉及战略取舍、投入较大或方向高度不确定
    reviewer_type: 产品战略角色
    focus:
      - 是否问到了真正影响方向的问题
      - 默认假设是否过强
  - when: 需求依赖数据判断
    reviewer_type: 数据分析能力
    focus:
      - 数据缺口是否被标注
      - 无数据时是否仍可做低成本验证

rules:
  - 不把复核提醒写成自动触发。
  - 不用固定问题库替代推演。
