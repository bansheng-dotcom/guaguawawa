id: demand-management
display_name: 需求管理与协作复核
status: draft
priority: P0
purpose: >
  管理正式开发输入：需求编号、需求卡、PRD 到执行需求拆解、下游文件标注、
  协作能力复核和工作日志。它只在用户确认进入正式执行时启动。

triggers:
  - 用户要求进入开发、提交需求、拆开发任务
  - PRD 已确认，需要转成可执行下游文件
  - 前端、后端、Agent、测试需要统一需求编号和复核状态
  - 用户指出文件不知道对应什么需求

entry_policy:
  before_entering:
    - 这是正式需求包/开发输入类重任务，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 必须已有用户确认的需求、PRD 或明确开发意图
  can_start_when:
    - 用户确认进入正式执行或需要可交付给下游的需求包
  must_not_start_when:
    - 需求仍在想法、质问或轻量判断阶段

inputs:
  required:
    - confirmed_requirement_or_prd
  optional:
    - project_root
    - downstream_roles
    - external_framework_notes

outputs:
  - requirement_card
  - linked_downstream_files
  - acceptance_and_test_references
  - collaboration_capability_review_record
  - worklog
  - briefing_for_user

owned_references:
  - references/demand-management-guide.md
  - references/prd-to-execution-guide.md
  - ../HEAVY_TASK_RAG_RULES.md
  - ../experience-rag/workflow.yaml

templates:
  - templates/product-requirement-submit-template.md
  - templates/collaboration-capability-review-template.md

prompt:
  current: prompts/current.md

runner: runner.md
topology: topology.md
review_hints: review_hints.yaml

version:
  current: 0.3
  updated_at: 2026-07-01
  notes: 重任务入口改为 RAG Gate 分层；生成并复用 experience_brief，关键维度变化才重新 Gate。
