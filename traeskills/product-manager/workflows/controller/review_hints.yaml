purpose: >
  给 PM 总控生成可选复核提醒，不自动触发任何本地 agent。

optional_reviews:
  - when: 任务跨产品、设计、开发、测试多个角色
    reviewer_type: 工程总控或项目负责人
    focus:
      - 路由是否选错
      - 是否过早进入执行
  - when: 用户说听不懂、不是我要的、文件乱
    reviewer_type: 产品管理复盘
    focus:
      - 是否需要记录偏好或纠错
      - 是否需要改项目理解与汇报方式

rules:
  - 只输出提醒，不写死触发机制。
  - 用户没有确认前，不把推荐路线写成既定决策。
