id: report-production
display_name: PM 报告生产
status: draft
priority: P1
purpose: >
  管理产品经理需要产出报告时的报告类型、证据层、视觉层和可选专业能力边界。
  它负责把报告做重、做清楚、做可决策；真实数据查询或高保真设计只写可选专业能力提醒。

triggers:
  - 用户要求写报告、汇报、整理成正式材料
  - 需要报告结构、证据、图表规划或高质量 Markdown 报告
  - 需要判断是否超出 PM 本地轻量写作、UI 或数据分析能力

entry_policy:
  before_entering:
    - 这是报告类重任务，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
  can_start_when:
    - 能说明报告读者、决策点或使用场景
  must_not_start_when:
    - 用户只是要轻量解释、单轮判断或仅质问思路

inputs:
  required:
    - report_goal
    - audience
  optional:
    - evidence_files
    - data_sources
    - project_context

outputs:
  - report_type
  - report_outline
  - evidence_plan
  - visual_plan
  - optional_professional_capability_note
  - final_report_or_report_brief

owned_references:
  - references/report-production-guide.md
  - ../HEAVY_TASK_RAG_RULES.md
  - ../experience-rag/workflow.yaml

prompt:
  current: prompts/current.md

runner: runner.md
topology: topology.md
review_hints: review_hints.yaml

version:
  current: 0.4
  updated_at: 2026-07-01
  notes: 本地轻量写作、UI、数据分析能力优先；超出部分只给可选专业能力提醒。
