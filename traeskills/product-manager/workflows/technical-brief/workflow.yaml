workflow_id: technical-brief
display_name: 技术翻译报告工作流
status: draft
owner: 产品管理
priority: P1
purpose: >
  将产品需求、PRD 或技术方案翻译成用户能判断、技术角色能接手的技术 brief。
  这个 workflow 负责说明用户影响、数据、接口、权限、后台任务、失败兜底和审查点；
  不替代架构设计、前端实现或后端实现。

trigger_signals:
  - 技术翻译
  - 技术方案讲成人话
  - 后端影响
  - 前端影响
  - Agent 影响
  - 接口和数据怎么说
  - 失败怎么办

entry_policy:
  before_entering:
    - 这是报告/文档类重任务，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 先确认这份 brief 是给用户拍板还是给技术接手
    - 如果需求未确认，先回 requirement-report 或 prd-report
    - 如果需要架构决策，先产出 PM 本地 brief，再给可选架构能力提醒
  can_start_when:
    - 有需求、PRD、技术方案或项目文件
    - 能说明技术说明服务哪个决策
  must_not_start_when:
    - 用户要求直接实现代码
    - 没有产品目标或技术对象

required_inputs:
  - requirement_or_technical_context
  - reader_or_decision
  - known_frontend_backend_agent_impacts
  - constraints

outputs:
  - technical_translation_report
  - user_impact_summary
  - frontend_backend_agent_impact_map
  - data_permission_failure_map
  - operator_fallback_plan
  - optional_review_hints
  - next_workflow_suggestion

managed_files:
  topology: workflows/technical-brief/topology.md
  quality_guide: workflows/technical-brief/references/technical-brief-guide.md
  review_hints: workflows/technical-brief/review_hints.yaml
  runner: workflows/technical-brief/runner.md
  prompt_current: workflows/technical-brief/prompts/current.md
  prompt_changelog: workflows/technical-brief/prompts/CHANGELOG.md
  heavy_task_rules: workflows/HEAVY_TASK_RAG_RULES.md

validation_gates:
  - gate: reader_gate
    pass_standard: 说明读者和需要拍板的问题
  - gate: impact_gate
    pass_standard: 用户、前端、后端、Agent 或运营影响分开写
  - gate: data_gate
    pass_standard: 数据来源、权限、状态变化、失败处理清楚
  - gate: fallback_gate
    pass_standard: 自动化失败时的人工兜底或恢复路径明确
  - gate: handoff_hint_gate
    pass_standard: 只给可选前端/后端/架构/Agent 复核提醒，不自动触发

version:
  prompt: "0.4"
  workflow: "0.4"
  updated_at: "2026-07-01"
