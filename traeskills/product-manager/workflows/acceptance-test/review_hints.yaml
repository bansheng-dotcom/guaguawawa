workflow_id: acceptance-test
version: "0.1"
type: optional_review_hints

purpose: >
  给验收与测试场景作者生成“后续可能需要谁复核”的提醒。这里不是触发图，
  不写死本地 agent 路径，也不自动分派任务。

rules:
  - 验收标准本身不依赖这些提醒才能完成。
  - 提醒使用角色类型，不使用本机路径。
  - 测试执行和 bug 修复不在本 workflow 内完成。

review_hints:
  test_reviewer:
    remind_when:
      - PRD 准备进入开发、验收或回归
    ask_them_to_check:
      - 主路径是否可复现
      - 边界和失败态是否覆盖
      - 优先级是否合理
      - 是否需要自动化或回归范围

  frontend_reviewer:
    remind_when:
      - 验收涉及页面、交互、路由或前端状态
    ask_them_to_check:
      - 页面状态是否能被用户看见
      - 空态、加载、错误、成功提示是否明确
      - 交互结果是否和验收一致

  backend_reviewer:
    remind_when:
      - 验收涉及接口、数据、权限、任务或日志
    ask_them_to_check:
      - 数据状态变化是否可检查
      - 权限和失败恢复是否覆盖
      - 日志、审计或 trace 是否需要验收

  agent_reviewer:
    remind_when:
      - 验收涉及 Agent、AI 输出、工具调用或自动化任务
    ask_them_to_check:
      - Agent 输出是否有契约
      - 失败时是否停下来问人
      - 人工兜底和审计是否明确
