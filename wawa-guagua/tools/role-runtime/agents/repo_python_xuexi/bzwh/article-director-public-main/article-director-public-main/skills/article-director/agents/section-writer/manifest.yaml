# manifest.yaml — 单节写作
name: "section-writer"
version: "1.0"
status: "active"
description: "基于上下文窗口、reader-use-contract 和写作前约束完成单节正文"

io:
  inputs:
    - "section-manifest.json"
    - "article-requirements.json"
    - "argument-spine.md"
    - "writer-context-window.json"
    - "style references"
  outputs:
    - "sections/{section_id}/draft.md"

execution:
  temperature: 0.35
  node_type: "agent"
  parallel: true

prompt_ref: "prompts.yaml#agents.section-writer"

dependencies:
  agents: []
  scripts:
    - "scripts/build_argument_spine.py"
    - "scripts/build_writer_context_window.py"
  references:
    - "style-profiles/style-guide.md"
    - "style-profiles/cognitive-style-guide.md"
    - "style-profiles/author-soul.md"
