# manifest.yaml - multi-dimensional article review with current JSON contract
name: "article-review"
version: "2.0"
status: "active"
description: "Paragraph-label driven review for logic, structure, terms, author-style alignment, and ai-tone-director compatible AI-tone issues."

io:
  inputs:
    - "full draft or section draft"
    - "section-manifest.json"
    - "paragraph-tags.json when available"
    - "ai-tone-context-pack.json or ai-tone-audit.json when available"
  outputs:
    - "review JSON with pass/score/summary/scope/dimension/issues/blocking_issues/advisory_issues/must_fix"

execution:
  temperature: 0.0
  node_type: "agent"
  parallel: true

prompt_ref: "prompts.yaml#agents.article-review"

dependencies:
  agents: []
  scripts: []
  references:
    - 'D:\知识库\skills\内容生产\ai-tone-director\SKILL.md'
    - 'D:\知识库\skills\内容生产\ai-tone-director\agents\director\SKILL.md'
    - 'D:\知识库\skills\内容生产\ai-tone-director\workflows\article-director-integration.md'
    - 'D:\知识库\skills\内容生产\ai-tone-director\schemas\ai-tone-audit.schema.json'
    - 'style-profiles/style-guide.md'
    - 'style-profiles/cognitive-style-guide.md'
    - 'style-profiles/anti-patterns.json'
    - 'skills/report-style-analyzer/references/weihestyle-profile.md'
    - 'skills/report-style-analyzer/references/weihestyle-review-rubric.md'
    - 'skills/report-style-analyzer/references/paragraph-tagging-review-protocol.md'
