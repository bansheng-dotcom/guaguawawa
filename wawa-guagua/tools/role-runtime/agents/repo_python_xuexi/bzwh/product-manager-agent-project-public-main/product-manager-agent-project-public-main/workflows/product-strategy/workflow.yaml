workflow_id: product-strategy
display_name: 产品战略与机会树工作流
status: draft
owner: 产品管理
priority: P1
purpose: >
  将阶段目标、用户分群、机会、方案、实验和取舍整理成产品战略判断。这个 workflow
  负责战略画布、机会树、阶段取舍和壁垒判断；不替代公司战略或商业最终决策。

trigger_signals:
  - 产品战略
  - 机会树
  - 阶段取舍
  - 战略画布
  - 做什么不做什么
  - 壁垒
  - roadmap 方向

entry_policy:
  before_entering:
    - 如果本轮要产出产品战略报告，按重任务处理，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 重任务先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 先明确当前阶段目标和用户分群
    - 如果只是单个需求是否成立，先走 requirement-report
    - 如果要写具体 PRD，先收敛到 prd-report
  can_start_when:
    - 有阶段目标、业务目标或一组机会/需求
    - 需要做取舍而不是只写执行文档
  must_not_start_when:
    - 只是要整理单个功能
    - 没有任何阶段目标或约束

required_inputs:
  - stage_goal
  - user_segments
  - opportunities_or_requirements
  - constraints

outputs:
  - product_strategy_report
  - opportunity_solution_tree
  - strategy_canvas
  - tradeoff_decision
  - next_validation_or_prd_path
  - optional_review_hints

managed_files:
  topology: workflows/product-strategy/topology.md
  quality_guide: workflows/product-strategy/references/product-strategy-guide.md
  review_hints: workflows/product-strategy/review_hints.yaml
  runner: workflows/product-strategy/runner.md
  prompt_current: workflows/product-strategy/prompts/current.md
  prompt_changelog: workflows/product-strategy/prompts/CHANGELOG.md
  heavy_task_rules: workflows/HEAVY_TASK_RAG_RULES.md

validation_gates:
  - gate: stage_gate
    pass_standard: 当前阶段目标、约束和成功信号清楚
  - gate: user_gate
    pass_standard: 用户分群按问题和任务定义，不只写人群标签
  - gate: opportunity_gate
    pass_standard: 机会、方案、实验分层，不直接跳功能
  - gate: tradeoff_gate
    pass_standard: 写清做什么、不做什么、为什么现在做
  - gate: moat_gate
    pass_standard: 说明长期壁垒或复利能力是否被增强

version:
  prompt: "0.3"
  workflow: "0.3"
  updated_at: "2026-07-01"
