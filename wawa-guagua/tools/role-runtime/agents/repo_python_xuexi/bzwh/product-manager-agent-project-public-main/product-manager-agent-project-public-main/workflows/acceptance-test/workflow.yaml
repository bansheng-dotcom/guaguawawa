workflow_id: acceptance-test
display_name: 验收与测试场景工作流
status: draft
owner: 产品管理
priority: P0
purpose: >
  将 PRD、需求卡或产品方案翻译成可检查的验收标准和测试场景。这个 workflow
  负责定义用户动作、系统结果、状态变化、边界场景和失败态；不负责执行测试或修复 bug。

trigger_signals:
  - 验收标准
  - 测试场景
  - Given When Then
  - 怎么验收
  - 边界场景
  - 失败态
  - PRD 验收

entry_policy:
  before_entering:
    - 如果本轮要产出正式验收文档，按重任务处理，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 重任务先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 先确认已有 PRD、需求卡、需求分析结果或清晰产品方案
    - 如果范围不清，先回 prd-report 或 requirement-report
    - 如果用户要执行测试，先产出测试 brief，再提醒转测试能力
  can_start_when:
    - 用户动作或系统行为基本明确
    - 至少能区分主路径和不在范围
  must_not_start_when:
    - 需求仍停留在想法阶段
    - 用户只要求写 PRD 或需求分析

required_inputs:
  - prd_or_requirement
  - user_flow_or_scenario
  - scope_and_out_of_scope
  - known_constraints

outputs:
  - acceptance_criteria
  - test_scenario_table
  - edge_case_list
  - failure_state_list
  - regression_scope_hint
  - optional_review_hints
  - next_workflow_suggestion

managed_files:
  topology: workflows/acceptance-test/topology.md
  quality_guide: workflows/acceptance-test/references/acceptance-test-guide.md
  review_hints: workflows/acceptance-test/review_hints.yaml
  runner: workflows/acceptance-test/runner.md
  prompt_current: workflows/acceptance-test/prompts/current.md
  prompt_changelog: workflows/acceptance-test/prompts/CHANGELOG.md
  heavy_task_rules: workflows/HEAVY_TASK_RAG_RULES.md

validation_gates:
  - gate: scope_gate
    pass_standard: 验收只覆盖本次范围，并明确不在范围
  - gate: gwt_gate
    pass_standard: 关键需求写成 Given/When/Then 或同等可检查格式
  - gate: state_gate
    pass_standard: 覆盖空态、加载、成功、失败、权限、异常或回退状态
  - gate: data_gate
    pass_standard: 涉及数据变化时写清数据前置、动作后状态和可观察结果
  - gate: testability_gate
    pass_standard: 每条标准都能被人工或自动方式验证
  - gate: handoff_hint_gate
    pass_standard: 只给测试/前后端/Agent 复核提醒，不自动触发

version:
  prompt: "0.3"
  workflow: "0.3"
  updated_at: "2026-07-01"
