workflow_id: prd-report
display_name: PRD 报告工作流
status: draft
owner: 产品管理
purpose: >
  将已经过轻量反应或 pm-grill 澄清的需求，整理成能让用户确认、
  能让后续执行者看懂的 PRD 报告。这个 workflow 只负责报告写作，
  不自动触发或绑定其他 agent；需要正式开发提交时，再进入 `workflows/demand-management/workflow.yaml`。

trigger_signals:
  - 整理需求
  - 写 PRD
  - 生成产品需求文档
  - 把想法变成开发输入
  - 这个功能怎么做

entry_policy:
  before_entering:
    - 先经过 `workflows/controller/workflow.yaml`
    - 这是报告/文档类重任务，先读 `workflows/HEAVY_TASK_RAG_RULES.md`
    - 先执行 `workflows/experience-rag/workflow.yaml` 的 `heavy-task` 模式；内部追问默认复用 `experience_brief`，关键维度变化才执行 `pre-question` L1
    - 若真正问题、用户场景、范围任一不清楚，先进入 `workflows/pm-thinking/workflow.yaml`
  can_start_when:
    - 真正问题能写成一句话
    - 用户或业务场景基本明确
    - 至少能区分范围和不在范围
  must_not_start_when:
    - 用户只是要轻量判断或聊天讨论
    - 关键取舍仍冲突且未确认
    - 没有任何需求来源或项目上下文

required_inputs:
  - user_request
  - confirmed_understanding
  - project_context
  - requirement_source

outputs:
  - requirement_card_draft
  - product_judgment_summary
  - prd_report
  - acceptance_criteria
  - risk_and_assumption_tests
  - optional_review_hints
  - user_confirmation_report
  - next_workflow_suggestion

managed_files:
  topology: workflows/prd-report/topology.md
  quality_guide: workflows/prd-report/references/prd-writing-guide.md
  review_hints: workflows/prd-report/review_hints.yaml
  runner: workflows/prd-report/runner.md
  prompt_current: workflows/prd-report/prompts/current.md
  prompt_changelog: workflows/prd-report/prompts/CHANGELOG.md
  heavy_task_rules: workflows/HEAVY_TASK_RAG_RULES.md

validation_gates:
  - gate: problem_gate
    pass_standard: 真正问题、目标用户、场景不是空泛描述
  - gate: value_gate
    pass_standard: 说明体验提升、成本降低、当前替代方案和用户为什么会行动
  - gate: scope_gate
    pass_standard: 范围和不在范围都清楚
  - gate: metrics_gate
    pass_standard: 成功指标有定义、基线/待补标注、目标、数据源和 Go/No-Go 用途
  - gate: assumption_gate
    pass_standard: 至少列出会让方案失败的承重假设，并给出最低成本验证
  - gate: report_completeness_gate
    pass_standard: PRD 报告包含问题、用户、场景、方案、验收、不在范围、风险和未决点
  - gate: handoff_hint_gate
    pass_standard: 若报告会变成正式开发输入，只给出可选审查提醒和下一步 workflow，不在本流程内触发 agent
  - gate: user_readability_gate
    pass_standard: 给用户的版本先讲结论和影响，不先堆技术细节

version:
  prompt: "0.5"
  workflow: "0.5"
  updated_at: "2026-07-01"
