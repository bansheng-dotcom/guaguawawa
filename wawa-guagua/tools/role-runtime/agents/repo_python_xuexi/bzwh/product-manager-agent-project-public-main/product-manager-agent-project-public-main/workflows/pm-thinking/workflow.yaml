id: pm-thinking
display_name: PM 质问与思考
status: draft
priority: P0
purpose: >
  用轻量 grill-me 能力帮助用户把想法想清楚。它不是固定问题库，
  而是先经过 pre-question L1 Gate 看索引、偏好和纠错摘要，再基于用户输入推演关键缺口，
  并尽量少问、完整问、问完能推进。

triggers:
  - 用户有想法但没有清楚的问题定义
  - 用户要求帮忙想清楚、质问、反问、判断是否成立
  - 进入 PRD、需求分析、MVP 前缺少方向性信息

inputs:
  required:
    - user_request
  optional:
    - project_context
    - known_facts
    - default_assumptions

outputs:
  - confirmed_facts
  - pre_question_experience_basis
  - default_assumptions
  - high_risk_gaps
  - recommended_workflow
  - draft_requirement_card_if_needed

owned_references:
  - references/pm-thinking-guide.md
  - ../experience-rag/workflow.yaml

prompt:
  current: prompts/current.md

runner: runner.md
topology: topology.md
review_hints: review_hints.yaml

version:
  current: 0.3
  updated_at: 2026-07-01
  notes: 将提问前经验调用收敛为 pre-question L1 Gate，避免固定问题库和重检索。
