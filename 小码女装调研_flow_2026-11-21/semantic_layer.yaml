schema: dsh.semantic/v3
entities:
- id: region
  type: spatial
  levels:
  - 全国
  - 省
  - 城市
- id: category
  type: hierarchy
  levels:
  - 大类
  - 子类
- id: brand
  type: party
- id: price_band
  type: hierarchy
  levels:
  - 低价带
  - 中价带
  - 高价带
- id: channel
  type: structural
  levels:
  - 淘宝
  - 天猫
  - 抖音
  - 小红书
  - 线下
- id: period
  type: time
  grain: year
grain_declarations:
- id: G_national_year
  dims:
  - region
  - category
  - year
- id: G_brand_channel_year
  dims:
  - brand
  - category
  - channel
  - year
- id: G_price_band
  dims:
  - channel
  - category
  - price_band
measures:
- id: market_size
  type: simple
  agg: sum
  expr: market_size
  unit: 亿元
  grain: G_national_year
  caliber:
    scope: 全国线上为主，人民币含税零售口径
- id: population
  type: simple
  agg: sum
  expr: population
  unit: 万人
  grain: G_national_year
  caliber:
    scope: 女性人口，身高159厘米以下
- id: supply_size
  type: simple
  agg: sum
  expr: supply_size
  unit: 亿元
  grain: G_national_year
  caliber:
    scope: 小个子专属供给，第三方口径
- id: store_count
  type: simple
  agg: count
  expr: store_count
  unit: 家
  grain: G_brand_channel_year
  caliber:
    scope: 平台在售店铺
- id: yoy
  type: simple
  agg: sum
  expr: yoy
  unit: "%"
  grain: G_national_year
  caliber:
    scope: 同比，名义增速
- id: share
  type: simple
  agg: sum
  expr: share
  unit: "%"
  grain: G_brand_channel_year
  caliber:
    scope: 销售额份额
- id: category_mix
  type: simple
  agg: sum
  expr: category_mix
  unit: "%"
  grain: G_national_year
  caliber:
    scope: 品类销售额占比
- id: price_band_share
  type: simple
  agg: sum
  expr: price_band_share
  unit: "%"
  grain: G_price_band
  caliber:
    scope: 价格带销售额占比
- id: return_rate
  type: simple
  agg: sum
  expr: return_rate
  unit: "%"
  grain: G_national_year
  caliber:
    scope: 退货率，综合电商与直播分开
- id: gross_margin
  type: simple
  agg: sum
  expr: gross_margin
  unit: "%"
  grain: G_national_year
  caliber:
    scope: 服饰行业均值
- id: unit_economics
  type: simple
  agg: sum
  expr: unit_economics
  unit: 元
  grain: G_national_year
  caliber:
    scope: 单均贡献，未扣退货物流
- id: asp
  type: simple
  agg: sum
  expr: asp
  unit: 元
  grain: G_price_band
  caliber:
    scope: 客单价/件单价
- id: inventory_turnover
  type: simple
  agg: sum
  expr: inventory_turnover
  unit: 天
  grain: G_national_year
  caliber:
    scope: 库存周转天数
- id: content_conversion
  type: simple
  agg: sum
  expr: content_conversion
  unit: "%"
  grain: G_brand_channel_year
  caliber:
    scope: 内容场观看转化率
- id: sku_sales
  type: simple
  agg: sum
  expr: sku_sales
  unit: 件
  grain: G_brand_channel_year
  caliber:
    scope: 平台单款月销，公开榜单口径
- id: sku_price
  type: simple
  agg: sum
  expr: sku_price
  unit: 元
  grain: G_price_band
  caliber:
    scope: 到手价（含折扣），人民币
- id: size_coverage
  type: simple
  agg: sum
  expr: size_coverage
  unit: 个
  grain: G_brand_channel_year
  caliber:
    scope: 同一款覆盖的尺码/身高段数量
- id: sku_return_rate
  type: simple
  agg: sum
  expr: sku_return_rate
  unit: "%"
  grain: G_brand_channel_year
  caliber:
    scope: 单款退货率，按渠道分列
boundaries:
- id: B1
  text: 全国口径与省区口径不可相加
  affects:
  - market_size
  - share
- id: B2
  text: 第三方估算与官方统计不可等同
  affects:
  - supply_size
  - market_size
- id: B3
  text: 平台单期榜单不能等同全国份额
  affects:
  - share
  - content_conversion
- id: B4
  text: 退货率按渠道分开，不取单一均值替代
  affects:
  - return_rate
fingerprint:
  key:
  - measure_id
  - entity_scope
  - period
