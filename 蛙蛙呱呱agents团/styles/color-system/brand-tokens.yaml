# styles/color-system/brand-tokens.yaml
brand: 一人公司 (One-Person Company)
theme: light

colors:
  primary: "#2c3e50"       # 主品牌色：深空蓝
  secondary: "#3498db"     # 强调色：科技蓝
  accent: "#e74c3c"        # 警告/警示色：商务红
  success: "#2ecc71"       # 成功/健康指标：翡翠绿
  background: "#f8f9fa"    # 报告背景色：高级灰白
  text_main: "#333333"     # 正文颜色

fonts:
  header: "'Helvetica Neue', 'Microsoft YaHei', sans-serif"
  body: "'Helvetica Neue', 'Microsoft YaHei', sans-serif"
  code: "Consolas, monospace"
