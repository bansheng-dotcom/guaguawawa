schema: dsh.collection_spec/v1
# 采集规格模板 —— 复制到**项目目录**（不是源码），改掉 <尖括号> 里的东西即可。
# 业务词只允许出现在本文件里，代码里不许出现。
id: <项目-业务-id>
title: <这份采集在做什么>
source: manual_csv          # 或 tmall_search / web_search
query:
  path: data/staging/<源文件>.csv     # 相对项目目录
  # web_search 源用这两项：
  # url: "https://..."
  # selectors: {item: "...", title: "...", price: "..."}

# ---------------------------------------------------------------------------
# 合规（2026-11-24 新增）：默认全部拒绝，逐项显式打开才能跑。
# 规则见 docs/COLLECTION-COMPLIANCE.md；缺 robots_allowed / rate_limit 的规格一律不执行。
# ---------------------------------------------------------------------------
compliance:
  public_page_only: true      # 只抓无需登录的公开页；登录墙/验证码一律放弃
  robots_allowed: false       # 已核对 robots.txt 允许抓取该路径（核对日写在 robots_checked_at）
  robots_checked_at: ""       # 例：2026-11-24
  terms_reviewed: false       # 已看过服务条款/转载声明
  license: ""                 # 数据的授权/使用范围（如「政府公开信息」「CC BY 4.0」「仅内部研究」）
  attribution: ""             # 报告里怎么署名（机构名 / 原页面标题）
  rate_limit_rps: 1           # 每秒请求数上限；不允许 >1
  crawl_window: "22:00-06:00" # 抓取时段（避开对方高峰）
  user_agent_note: ""         # UA 里带的项目标识与联系方式
  pii: false                  # 是否含个人信息；含则默认不采
  retention_days: 180         # 原始页/HTML 快照保留天数
  store_html_hash: true       # 每行落 url + fetched_at + sha256（可回溯，与 source_verify 同口径）

rollups:
  - id: <分析粒度名，如 brand_month>
    grain: [<维度1>, <维度2>]        # 一行代表什么（分析粒度）
    series: true                     # 需要时间序列就写 true（G-E 会查源有没有历史）
    derive:                          # 从原子列派生（DSL 见 core/grain.py）
      <维度1>: "token:title:0"
      <维度2>: "substr:snapshot_date:0:7"
    measures:
      <度量>: {agg: mean|sum|count|min|max, expr: "<原子列四则运算>", unit: "<单位>"}

claims:
  - id: <判断-id>
    title: <判断标题：要能当小节标题用>
    dataset: <上面的 rollup id>
    query: {group_by: [<维度>], metrics: [<度量>]}
    min_rows: 3                       # 至少几个可比点（≥3）
    chart: {type: hbar|line|stacked_bar, x: <维度>, metric: <度量>}
    falsifier: <什么可观测条件下这条判断作废>
