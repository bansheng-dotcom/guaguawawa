# 文笔与深度阈值（唯一出处）
# 口径见 docs/REPORT-PROSE-STYLE.md
prose:
  # 与 docs/REPORT-FLOW.md §5 对齐：研究级正文每节 1,000–1,600 字
  chars_per_section: [1000, 1600]
  chars_table_section: [800, 1300]
  chars_hard_min: 800
  numbers_per_1000_chars_min: 15
  required_blocks: [结论, 事实, 机理, 反例, 所以]
  markers: [判别, 证伪, 如果, 若, 下一期, 信号]
  contrast_markers: [不是, 而是, 一种解释, 另一种解释]
  max_suoyi_paragraphs: 1
  voice: "你"
  cover_questions: 3
  cover_actions: 3
  part_dividers: 3
  footnotes_per_section_min: 1

banned_phrases:
  - "这张表回答"
  - "对进入者的含义"
  - "本节将"
  - "下面我们来看"
  - "综上所述"
  - "值得注意的是"
  - "不难发现"
  - "要重视"
  - "要加强"
  - "要优化"
  - "建议进一步研究"
  - "市场空间很大"
  - "竞争非常激烈"
  - "增长潜力巨大"

rubric:
  pass: 70
  usable: 55
  weights:
    判断力: 20
    机理: 20
    判别证伪: 15
    具体性: 15
    反方边界: 10
    节奏人称: 10
    证据密度: 10

audit:
  hard: [判断力, 机理, 判别证伪, 具体性, 反方边界]
  soft: [节奏人称, 证据密度]
