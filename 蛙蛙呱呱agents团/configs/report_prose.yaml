# 文笔与深度阈值（唯一出处）
# 口径见 docs/REPORT-PROSE-STYLE.md
prose:
  # 与 docs/REPORT-FLOW.md §5 对齐：研究级正文每节 1,000–1,600 字
  chars_per_section: [1000, 1600]
  chars_table_section: [800, 1300]
  chars_hard_min: 800
  numbers_per_1000_chars_min: 15
  required_blocks: [结论, 事实, 机理, 反例, 所以]
  markers: [判别, 证伪, 如果, 若, 下一期, 信号]
  contrast_markers: [不是, 而是, 一种解释, 另一种解释]
  max_suoyi_paragraphs: 1
  voice: "你"
  cover_questions: 3
  cover_actions: 3
  part_dividers: 3
  footnotes_per_section_min: 1

banned_phrases:
  - "这张表回答"
  - "对进入者的含义"
  - "本节将"
  - "下面我们来看"
  - "综上所述"
  - "值得注意的是"
  - "不难发现"
  - "要重视"
  - "要加强"
  - "要优化"
  - "建议进一步研究"
  - "市场空间很大"
  - "竞争非常激烈"
  - "增长潜力巨大"

rubric:
  pass: 70
  usable: 55
  weights:
    判断力: 20
    机理: 20
    判别证伪: 15
    具体性: 15
    反方边界: 10
    节奏人称: 10
    证据密度: 10

audit:
  hard: [判断力, 机理, 判别证伪, 具体性, 反方边界]
  soft: [节奏人称, 证据密度]

# 结构同构门禁（2026-11-26 新增）
# 只看「段首标签序列 + 段数」；连续成片才算违规，两节相似只记录不拦。
# 目的是拦住「每节都是 结论→事实→机理→反例→所以」这种能拿满分却像模板的稿子。
structure_gate:
  enabled: true
  min_run: 3        # 连续多少节同构才判违规
  min_blocks: 3     # 结构指纹至少包含几个段块

# 表达候选器（2026-11-26 新增）
# 一次生成 n 个候选，数字集合必须一致；<pass 淘汰；可用 <2 重生成，最多 max_rounds 轮。
# 无模型时只能做措辞骨架差异，diversity 仅对 LLM 候选硬淘汰（规则候选只测量）。
candidates:
  enabled: true
  n: 3
  max_rounds: 3
  pass: 85
  diversity_max: 0.6
  budget_ms_per_section: 400   # 单节选稿耗时上限，超了就退回单候选
