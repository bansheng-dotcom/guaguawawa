- title: 切片
  question: 最小可验证的链路是哪条？
  intro: 切片是一条能走通的路径，不是一堆页面。
  boundary: 切片范围以用户主路径为准。
- title: 成本
  question: 做出来要多少人日？
  intro: 估时不含联调与返工，就是低估。
  boundary: 人日为粗略估算，误差 ±30%。
- title: 验证
  question: 怎么算通过/失败？
  intro: 没有杀死标准的 MVP，会一直活着。
  boundary: 标准需可观测、可判定。
- title: 转化要素
  question: 页面结构够不够？
  intro: 落地页八要素，缺一项就少一层转化。
  boundary: 要素核验为主观评分，需人工复核。
