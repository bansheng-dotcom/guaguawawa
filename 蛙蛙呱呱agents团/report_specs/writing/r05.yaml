# R05 蛙深远 · 调查报告写作配置（领域专属，约 60 行）
# 只写「怎么讲」：节序、每节的验证问题 / 导语 / 证据边界、结论先行四段。
# 节标题由证据包算出的结论句覆盖（heading），本文件里的 title 只作节点标识。
# 数字一律来自证据包（claims / metrics / charts / decisions），本文件不写任何数字。

role: r05
doc_type: 调研报告 · 蛙深远
# 标题在冒号处断行：主句一行，论点一行
title: "内蒙古水果 2026 年 10—11 月\n价格、区域价差与链路加价"
# 封面高亮：只划副标题短语，样式用黄色下划线（不铺色块）
title_highlight: 价格、区域价差与链路加价
title_highlight_style: underline
meta:
  - 读者：创始人与经营决策者
  - 数据截止：2026-11-12
  - 口径：全国 6 种批发 · 呼市 8 种零售 · 产地市场 三套并列
  - 样本：38 个交易日 + 9 周 + 57 个批发市场
footer:
  - r05 蛙深远 · 战略研究官
  - 数据：农业农村部 / 呼市商务局 / 郑商所 / 统计公报；台账 evidence_ledger.json
  - shared/report_writer + core/report_renderer 确定性渲染

sections:
  - title: 总量与趋势
    question: 全国水果盘子在涨还是在跌？波动来自哪里？
    intro: 先看总量，再看结构。总量只回答“还有没有生意”，结构才回答“生意在哪一段”。
    boundary: 全国篮子只覆盖 6 个监测品种、批发口径，不含零售加价与品种内部等级差。
    chart: 总量与趋势
  - title: 内蒙古本地价格
    question: 本地零售与全国批发差多少？差在哪一层？
    intro: 把本地零售价放到全国批发基准上量一次，价差才知道是“涨出来的”还是“层出来的”。
    boundary: 呼市周报给的是 8 种水果均价，与全国 6 种篮子品种不同，绝对值不可直接相减。
    chart: 内蒙古本地价格
  - title: 区域价差与链路加价
    question: 同一品种跨市场差几倍？加价发生在哪一段？
    intro: 价差要先排除规格，再谈区域；否则会把“等级差”当成“区域溢价”。
    boundary: 两端规格/等级未完全匹配，倍率只作方向参考，不作定价依据。
    chart: 区域价差与链路加价
  - title: 规格
    question: 涨跌发生在哪个规格上？
    intro: 均价是加权结果，规格才是交易对象；不拆规格，就会把结构变化读成行情变化。
    boundary: 70-84 规格 73 个交易日恒为 7.60（报价未更新），该档只作方向参考。
    chart: 规格
  - title: 期货与预期
    question: 期货给出的价格预期是什么？和现货能互相替代吗？
    intro: 期货交易的是预期，现货反映的是当下成交；两者方向可以一致，幅度不能互相代入。
    boundary: 主力合约价格含交割月与资金因素，不能直接当作现货价格预测。
    chart: 期货与预期
  - title: 产业面与产能
    question: 本地供给与冷链能力撑不撑得住？
    intro: 产能决定议价空间，冷链决定损耗上限；这两项是链路动作的物理前提。
    boundary: 自治区与全国统计口径不同，产量数字只作方向，不做跨省对比。
  - title: 市场容量
    question: 这个盘子的可及规模有多大？假设是什么？
    intro: 容量测算的价值不在那一个数，而在“哪些参数一变，结论就变”。
    boundary: 份额与渗透率是结构假设，不是实测；必须在第一个月用动销数据校准。
    chart: 市场容量
  - title: 盈利与敏感性
    question: 这条链上还能从哪里挤出利润？
    intro: 冷链 0.21 元已经是低值，真正的杠杆在损耗——它不是行情，是管理。
    boundary: 毛利按批发口径测算，不含门店租金、人工与生鲜折价；损耗率为项目口径 8%。
    chart: 盈利与敏感性
  - title: 数据质量与口径冲突
    question: 哪些数字不能直接比？哪些结论最可能错？
    intro: 这一节放的是“不能用的数”和“可能错的判断”，比能用的数更值钱——用错口径的结论比没有结论更贵。
    boundary: 口径冲突项已单列并排除出定价/毛利结论；反向检验项不推翻结论，只限定它的强度。
  - title: 数据缺口
    question: 这盘生意还有哪些问题本报告答不了？
    intro: 短缺的数据会改动作——写清楚缺什么，比补一句“有待进一步研究”有用。
    boundary: 缺口项已排除出结论；补齐后须重跑本报告，不能拿旧结论外推。
  - title: 结论与行动
    question: 所以该做什么、不该做什么？
    intro: 顺着流走，别逆着走；每条动作都写死失效信号，变了就改。以上是条件化建议，不替代创始人拍板；涉资、签约与渠道承诺须按 R01 决策卡另行签发。
    table: decision
    no_reading: true

