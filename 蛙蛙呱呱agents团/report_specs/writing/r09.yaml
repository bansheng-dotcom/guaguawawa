  question: 模块边界清不清？
  intro: 边界不清的模块，最后都会长成一张网。
  boundary: 边界以接口与数据所有权为准。
- title: 风险接口
  question: 改这个接口会不会炸？
  intro: 破坏性变更必须提前列出调用方。
  boundary: 风险按调用方数量与兼容性分级。
- title: 覆盖
  question: 覆盖够不够发版？
  intro: 覆盖率不是目的，未覆盖的关键路径才是风险。
  boundary: 覆盖率按语句覆盖统计，不含集成测试。
