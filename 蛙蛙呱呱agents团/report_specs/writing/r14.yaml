title: '呼市鲜果：交易勾稽

  与履约状态'
title_highlight: 与履约状态
title_highlight_style: underline
meta:
- 读者：财务 / 运营
- 数据截止：2026-11-13
- 口径：订单-支付-退款-履约四表
- 样本：96 单、4 个渠道
footer:
