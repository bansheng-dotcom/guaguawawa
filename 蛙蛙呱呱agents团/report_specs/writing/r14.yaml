sections:
- title: 勾稽
  question: 应收和实收差多少？
  intro: 钱的差额必须能逐笔归因，否则就是坏账。
  boundary: 订单金额含运费与优惠，未拆税。
  chart: bridge
- title: 退款
  question: 退款集中在哪？
  intro: 退款率是表面，原因是动作。
  boundary: 退款按金额与单量双口径统计。
- title: 履约
  question: 时效的尾部在哪？
  intro: 均值掩盖尾部，尾部才是投诉来源。
  boundary: 履约天数按签收日减发货日。
- title: 状态异常
  question: 三态有没有打架？
  intro: 已付未交付、已退已交付是最贵的两类错。
  boundary: 异常判据为状态字段互斥性。
- title: 状态矩阵
  question: 四类状态各占多少？
  intro: 状态矩阵是交易系统的体检表。
  boundary: 四类互斥，合计等于总单量。
- title: 渠道结构
  question: 哪个渠道客单最高？
  intro: 渠道差异决定预算与履约策略。
  boundary: 客单为期间均值，未剔除极端单。
  chart: channel
- title: 数据缺口
  question: 还有哪些交易问题答不了？
  intro: 缺表就写缺表，不要用结论补。
  boundary: 缺口项已排除出结论。
- title: 判断与动作
  question: 先修哪一段？
  intro: 先闭环，再扩张。
  table: decision
  no_reading: true
